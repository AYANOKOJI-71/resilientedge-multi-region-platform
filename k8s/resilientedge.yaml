apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilientedge-api
  labels: { app.kubernetes.io/name: resilientedge-api }
spec:
  replicas: 3
  selector: { matchLabels: { app.kubernetes.io/name: resilientedge-api } }
  template:
    metadata: { labels: { app.kubernetes.io/name: resilientedge-api } }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app.kubernetes.io/name: resilientedge-api } }
      containers:
        - name: api
          image: ghcr.io/example/resilientedge-api:replace-me
          ports: [{ containerPort: 4600 }]
          readinessProbe: { httpGet: { path: /health, port: 4600 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 4600 }, initialDelaySeconds: 15 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: resilientedge-api }
spec:
  minAvailable: 2
  selector: { matchLabels: { app.kubernetes.io/name: resilientedge-api } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: resilientedge-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: resilientedge-api }
  minReplicas: 3
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
